# One-time extraction workflow. Remove after standalone migration is verified.
name: Bootstrap standalone Borrower

on:
  push:
    paths:
      - '.github/workflows/bootstrap-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract current Borrower from Investor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Borrower repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout current PiHub source
        uses: actions/checkout@v5
        with:
          repository: Nischhalsubba/Pihub-Investor
          ref: main
          path: .source-investor

      - name: Extract Borrower and its required shared foundation
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src e2e packages tooling
          rm -f index.html package.json package-lock.json playwright.config.mjs vite.config.mjs vercel.json tsconfig.base.json

          cp -R .source-investor/apps/borrower/src ./src
          cp -R .source-investor/apps/borrower/e2e ./e2e
          cp .source-investor/apps/borrower/index.html ./index.html
          cp .source-investor/apps/borrower/package.json ./package.json
          cp .source-investor/apps/borrower/package-lock.json ./package-lock.json
          cp .source-investor/apps/borrower/playwright.config.mjs ./playwright.config.mjs
          cp .source-investor/apps/borrower/vercel.json ./vercel.json

          mkdir -p packages tooling
          cp -R .source-investor/packages/ui packages/ui
          cp -R .source-investor/packages/platform packages/platform
          cp -R .source-investor/packages/domain packages/domain
          cp -R .source-investor/packages/contracts packages/contracts
          cp .source-investor/tooling/vite-shared-package-resolve.mjs tooling/vite-shared-package-resolve.mjs
          cp .source-investor/tsconfig.base.json ./tsconfig.base.json

          rm -f e2e/live-production.mjs

          find src -type f \( -name '*.js' -o -name '*.jsx' \) -print0 | \
            xargs -0 sed -i 's#../../../packages/#../packages/#g'

          cat > vite.config.mjs <<'VITE'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { sharedPackageResolve } from './tooling/vite-shared-package-resolve.mjs';

          const here = path.dirname(fileURLToPath(import.meta.url));

          export default defineConfig({
            plugins: [react()],
            resolve: sharedPackageResolve(import.meta.url),
            server: { fs: { allow: [here] } },
            build: { outDir: 'dist', emptyOutDir: true, target: 'es2020', sourcemap: false, chunkSizeWarningLimit: 650 },
            test: { globals: true, environment: 'jsdom', include: ['src/**/*.{test,spec}.{js,jsx}'] },
          });
          VITE

          cat > README.md <<'README'
          # PiHub Borrower

          Standalone PiHub Borrower / origination workspace.

          ## Ownership

          This repository owns Borrower-only product discovery, financing applications, corporate/project/financial information, document requests, closing status, and Borrower account flows.

          It does **not** contain Investor, Advisory, Admin, or Access applications.

          ## Shared UI snapshot

          `packages/ui`, `packages/platform`, `packages/domain`, and `packages/contracts` are the shared PiHub foundation snapshot required by the extracted Borrower application. They are included here temporarily so this repository builds and deploys independently without importing source from another application repository. They can be replaced by versioned `@pihub/*` packages when the dedicated PiHub Platform repository is created.

          ## Commands

          - `npm ci --legacy-peer-deps`
          - `npm run dev`
          - `npm run test:unit`
          - `npm run build`
          - `npm run test:e2e`

          ## Deployment

          Vercel should connect this repository directly with Root Directory `.`. `vercel.json` builds only this Borrower application.
          README

          rm -rf .source-investor

      - name: Normalize lockfile and verify build
        run: |
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run test:unit
          npm run build

      - name: Commit extracted standalone repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src e2e packages tooling index.html package.json package-lock.json playwright.config.mjs vite.config.mjs vercel.json tsconfig.base.json
          if git diff --cached --quiet; then
            echo 'Borrower extraction is already current.'
            exit 0
          fi
          git commit -m 'feat: extract standalone PiHub Borrower'
          git push origin HEAD:main

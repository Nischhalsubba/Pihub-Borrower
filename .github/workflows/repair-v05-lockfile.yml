name: Repair Borrower v0.5 lockfile

on:
  push:
    branches:
      - fix/v05-deployment-lockfile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit verified lockfile and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-v05-lockfile.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "fix: sync v0.5 npm lockfile for deployment"
          git push origin HEAD:fix/v05-deployment-lockfile

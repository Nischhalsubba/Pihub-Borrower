name: Hydrate Borrower v0.5

on:
  push:
    branches:
      - feat/borrower-v0.5-platform-expansion

permissions:
  contents: write

jobs:
  hydrate:
    if: ${{ !contains(github.event.head_commit.message, '[v0.5 hydrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore oversized v0.5 files
        shell: bash
        run: |
          set -euo pipefail
          cat .v05-hydrate/part*.b64 > /tmp/missing.b64
          base64 --decode /tmp/missing.b64 > /tmp/missing.tgz
          echo "465afb02aa3a1941e55914036bb089345fa9aeb13e26585a8ffcbdb92afa48f0  /tmp/missing.tgz" | sha256sum --check --strict
          tar -xzf /tmp/missing.tgz
          rm -rf .v05-hydrate
          rm -f .github/workflows/hydrate-v05.yml

      - name: Commit complete v0.5 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: hydrate Borrower v0.5 platform expansion [v0.5 hydrated]"
          git push origin HEAD:feat/borrower-v0.5-platform-expansion

name: Hydrate Borrower v0.6

on:
  push:
    branches:
      - fix/borrower-investor-parity-i18n
    paths:
      - '.v06-bin/READY'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify v0.6 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v06-bin/part-* > /tmp/pihub-borrower-v06-diff.tgz
          echo 'b022c21794a2c282f461b13c7d21aec7ce431f576d4dc4e645de11d24df7b7d4  /tmp/pihub-borrower-v06-diff.tgz' | sha256sum -c -

      - name: Apply v0.6 changes and preserve repository infrastructure
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/pihub-borrower-v06-diff.tgz -C .
          rm -rf .v06-transfer .v06-diff-transfer .v06-bin
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          if (fs.existsSync(path)) {
            const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
            lock.version = '0.6.0';
            if (lock.packages && lock.packages['']) lock.packages[''].version = '0.6.0';
            fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run domain, UI, security and architecture validation
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit hydrated v0.6 tree and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hydrate-v06.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore Investor parity and full Borrower localization'
          git push origin HEAD:fix/borrower-investor-parity-i18n
